[project]
name = "kbs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "bm25s~=0.3.9",
  "numpy~=2.5.1",
  "pypdf~=6.14.2",
  "mlx-embeddings~=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm~=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "llama-cpp-python~=0.3.35; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[tool.pytest.ini_options]
markers = [
  "integration: requires live network access",
]
