# >>> knowledge-based-search >>>
[mcp_servers.knowledge-based-search]
command = "__KBS_PYTHON__"
args = ["__KBS_SERVER__"]

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"
[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 __KBS_DIR__/hooks/session_start.py"
statusMessage = "Loading knowledge based search"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 __KBS_DIR__/hooks/prompt_inject.py"
