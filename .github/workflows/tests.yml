name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest -r requirements.txt
      - run: python -m pytest tests/ server/tests/ -q -m "not integration"
      - run: bash -n install.sh remove.sh scripts/setup.sh scripts/lib.sh

  live-search:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest -r requirements.txt
      - run: python -m pytest server/tests/test_search_api.py::test_result_reference_survives_separate_cli_processes -q
